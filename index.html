<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Calculadora Neumórfica</title>

<script src="https://cdn.tailwindcss.com"></script>

<link rel="stylesheet" href="css/styles.css">

</head>

<body class="theme-neumorphic min-h-screen flex items-center justify-center">

<div class="calc-container w-full max-w-[320px]">

<div class="calc-body p-6 flex flex-col gap-4">

<!-- Pantalla -->

<div class="flex flex-col items-end justify-end h-20 px-2">

<div id="history" class="text-xs opacity-60 h-4"></div>

<div id="display" class="text-4xl font-light">0</div>

</div>

<!-- Botones -->

<div class="grid grid-cols-4 gap-3">

<button onclick="action('C')" class="btn-calc">C</button>
<button onclick="action('DEL')" class="btn-calc">←</button>
<button onclick="action('%')" class="btn-calc">%</button>
<button onclick="action('/')" class="btn-calc">÷</button>

<button onclick="num('7')" class="btn-calc">7</button>
<button onclick="num('8')" class="btn-calc">8</button>
<button onclick="num('9')" class="btn-calc">9</button>
<button onclick="action('*')" class="btn-calc">×</button>

<button onclick="num('4')" class="btn-calc">4</button>
<button onclick="num('5')" class="btn-calc">5</button>
<button onclick="num('6')" class="btn-calc">6</button>
<button onclick="action('-')" class="btn-calc">-</button>

<button onclick="num('1')" class="btn-calc">1</button>
<button onclick="num('2')" class="btn-calc">2</button>
<button onclick="num('3')" class="btn-calc">3</button>
<button onclick="action('+')" class="btn-calc">+</button>

<button onclick="num('0')" class="btn-calc col-span-2">0</button>
<button onclick="num('.')" class="btn-calc">.</button>
<button onclick="calculate()" class="btn-calc">=</button>

</div>

</div>

</div>

<script src="js/script.js"></script>

</body>
</html>
